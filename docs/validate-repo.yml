name: Validate Repo Structure

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "❌ /docs folder is missing"
            exit 1
          fi
          echo "✅ /docs folder found"

      - name: Check required files exist in /docs
        run: |
          required_files=("docs/erd.png" "docs/RaceDay_Planning_Part1.docx" "docs/raceday.sql")
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            fi
            echo "✅ Found: $file"
          done
