name: Part 2 - Validate Structure, Build and Test

on:
  push:
  pull_request:

jobs:
  validate-structure:
    name: Validate repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files and folders
        run: |
          missing=0

          echo "== Required files =="
          for f in \
            README.md \
            docs/erd.png \
            docs/raceday_db.sql \
            docs/RaceDay_Planning_Part1.docx \
            Part2-API/RaceDay.sln \
            Part2-API/src/RaceDay.Api/RaceDay.Api.csproj \
            Part2-API/src/RaceDay.Api/Program.cs \
            Part2-API/src/RaceDay.Api/appsettings.json \
            Part2-API/tests/RaceDay.Api.Tests/RaceDay.Api.Tests.csproj; do
            if [ -f "$f" ]; then echo "OK       $f"; else echo "MISSING  $f"; missing=1; fi
          done

          echo "== Required folders =="
          for d in \
            docs \
            Part2-API/src/RaceDay.Api/Controllers \
            Part2-API/src/RaceDay.Api/Models \
            Part2-API/src/RaceDay.Api/Data \
            Part2-API/tests/RaceDay.Api.Tests; do
            if [ -d "$d" ]; then echo "OK       $d/"; else echo "MISSING  $d/"; missing=1; fi
          done

          echo "== README content =="
          if grep -qi "Part 2" README.md; then echo "OK       README documents Part 2"; else echo "MISSING  Part 2 section in README.md"; missing=1; fi

          echo "== EF Core migrations (code-first) =="
          if ls Part2-API/src/RaceDay.Api/Migrations/*.cs >/dev/null 2>&1; then
            echo "OK       Migrations folder present"
          else
            echo "::warning::No EF Core Migrations folder found (run Add-Migration InitialCreate and commit it)"
          fi

          if [ "$missing" -ne 0 ]; then
            echo "::error::Repository structure check failed - see MISSING entries above"
            exit 1
          fi
          echo "Repository structure is valid."

  build-and-test:
    name: Build and run unit tests
    needs: validate-structure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Part2-API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore RaceDay.sln
      - name: Build
        run: dotnet build RaceDay.sln --no-restore --configuration Release
      - name: Run unit tests
        run: dotnet test RaceDay.sln --no-build --configuration Release --verbosity normal
