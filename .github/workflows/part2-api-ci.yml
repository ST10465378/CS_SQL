name: Part 2 - Validate Structure, Build and Test

on:
  push:
  pull_request:

jobs:
  validate-structure:
    name: Validate repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files and folders
        run: |
          missing=0
          ok()   { echo "OK       $1"; }
          miss() { echo "MISSING  $1"; missing=1; }

          echo "== Required files =="
          for f in README.md docs/erd.png docs/raceday_db.sql; do
            if [ -f "$f" ]; then ok "$f"; else miss "$f"; fi
          done
          if ls docs/*.docx >/dev/null 2>&1; then ok "docs/*.docx (Part 1 planning document)"; else miss "docs/*.docx (Part 1 planning document)"; fi

          SLN=$(find . -name '*.sln' -not -path './.git/*' | head -n 1 || true)
          if [ -n "$SLN" ]; then ok "solution file: $SLN"; else miss "a .sln solution file"; fi

          API=$(grep -rl --include='*.csproj' 'Microsoft.NET.Sdk.Web' . 2>/dev/null | head -n 1 || true)
          if [ -n "$API" ]; then ok "API project: $API"; else miss "ASP.NET Core Web API project (.csproj)"; fi

          TESTS=$(grep -rliE --include='*.csproj' 'xunit|nunit|mstest' . 2>/dev/null | head -n 1 || true)
          if [ -n "$TESTS" ]; then ok "unit test project: $TESTS"; else miss "unit test project (.csproj with xunit/nunit/mstest)"; fi

          echo "== Required folders =="
          if [ -d docs ]; then ok "docs/"; else miss "docs/"; fi
          for d in Controllers Models Data; do
            F=$(find . -type d -name "$d" -not -path '*/bin/*' -not -path '*/obj/*' | head -n 1 || true)
            if [ -n "$F" ]; then ok "$F/"; else miss "a $d folder"; fi
          done

          echo "== README content =="
          if grep -qi "Part 2" README.md; then ok "README documents Part 2"; else miss "Part 2 section in README.md"; fi

          echo "== EF Core migrations (code-first) =="
          if find . -type d -name Migrations -not -path '*/bin/*' -not -path '*/obj/*' | grep -q .; then
            ok "Migrations folder present"
          else
            echo "::warning::No EF Core Migrations folder found (run Add-Migration InitialCreate and commit it)"
          fi

          if [ "$missing" -ne 0 ]; then
            echo "::error::Repository structure check failed - see MISSING entries above"
            exit 1
          fi
          echo "Repository structure is valid."

  build-and-test:
    name: Build and run unit tests
    needs: validate-structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Locate solution
        id: sln
        run: echo "path=$(find . -name '*.sln' -not -path './.git/*' | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Restore
        run: dotnet restore "${{ steps.sln.outputs.path }}"
      - name: Build
        run: dotnet build "${{ steps.sln.outputs.path }}" --no-restore --configuration Release
      - name: Run unit tests
        run: dotnet test "${{ steps.sln.outputs.path }}" --no-build --configuration Release --verbosity normal
